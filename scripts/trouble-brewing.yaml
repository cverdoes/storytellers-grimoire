      Imp:
        setup: >-
          Investigator and Ravenkeeper are still off the bluff table,
          and Soldier is now reserved for the Drunk's own claim (see the
          Drunk entry below) — don't double it up as a bluff too, or
          you'll have two players both quietly claiming to be Soldier.
          Librarian, Chef, and Mayor remain the trio to use.
      Drunk:
        setup: >-
          Tell them they're the Soldier — it's the lowest-maintenance
          assignment available: no night action to fake, no nightly
          bookkeeping to remember. If the Demon successfully kills them,
          the false sense of safety just quietly evaporates without you
          ever having had to track anything in between.
