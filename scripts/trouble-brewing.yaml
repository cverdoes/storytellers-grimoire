      - Monk
      - Slayer
      - Virgin
      - Investigator
      - Ravenkeeper
      - Saint
      - Drunk
      - Poisoner
      - Spy
      - Scarlet Woman
      - Imp
    recommendations:
      Fortune Teller:
        setup: >-
          Drunk doesn't unlock a standout pick either — unlike Recluse
          or Spy, nothing in this roster's ability text gives it a
          documented mis-registration effect, so it's just another
          plain good player for Fortune Teller purposes. The same hedge
          holds one more time: lean toward a Townsfolk that stays quiet
